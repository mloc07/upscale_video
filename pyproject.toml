[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoup"
version = "0.1.0"
description = "Eco Video Upscaler - AI video super-resolution with GPU thermal and resource protection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24.0,<2.0.0",
    "opencv-python-headless>=4.8.0",
    "nvidia-ml-py>=12.535.133",
    "onnxruntime-gpu>=1.17.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
ecoup = "ecoup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
