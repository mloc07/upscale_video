input: null                 # đường dẫn video, có thể truyền qua CLI
output: null

model:
  name: realesr-general-x4v3
  path: models/realesr-general-x4v3.onnx
  scale: 4                  # scale gốc của model
  target_scale: 2           # scale đầu ra mong muốn (resize phần còn lại)
  precision: fp16           # fp16 | fp32

inference:
  provider: auto            # auto | cuda | tensorrt | cpu
  tile_size: 256            # 0 = không chia tile
  tile_overlap: 16
  batch_size: 1
  clip_length: 16           # Số khung hình mỗi đoạn cho VideoUpscaleEngine
  clip_overlap: 2           # Số khung gối đầu để cross-fade chống giật chỗ nối

frame_saving:
  enable_dedup: true
  dedup_threshold: 0.5      # MSE nhỏ hơn ngưỡng này thì coi là khung trùng
  enable_scene_detect: false

thermal:
  enabled: true
  poll_interval_sec: 2
  temp_soft_c: 70           # vượt ngưỡng này: bắt đầu throttle
  temp_hard_c: 80           # vượt ngưỡng này: tạm dừng đến khi nguội
  temp_resume_c: 65         # nguội xuống ngưỡng này thì chạy lại
  max_gpu_util_pct: 85
  throttle_sleep_ms_min: 0
  throttle_sleep_ms_max: 500
  power_limit_watts: null   # null = không đụng; cần quyền admin nếu đặt

encode:
  codec: auto               # auto | h264_nvenc | hevc_nvenc | libx264
  crf_or_cq: 21
  preset: p4                # preset NVENC
  copy_audio: true

checkpoint:
  enabled: true
  dir: .ecoup_state
  interval_frames: 300

# Preset mặc định: Phục chế video người thật (720p -> 1440p)
pre_process:
  denoise: 0.10             # Khử artifact nén nhẹ trước AI (0.0 - 1.0)

post_process:
  color_fix: true           # Khắc phục lệch màu & nhấp nháy ánh sáng bằng Wavelet
  recover_detail: 0.10      # Trộn 10% ảnh gốc phóng bicubic để bảo vệ nhận dạng mặt
  sharpen: 0.15             # Làm nét nhẹ viền mi mắt và sợi tóc (0.0 - 1.0)
  film_grain: 0.0           # Hạt film grain mịn chống sáp (0.005 - 0.015 nếu cần, mặc định tắt)
